apiVersion: apps/v1
kind: Deployment
metadata:
  name: futurapredict-api
  labels:
    app: futurapredict
spec:
  replicas: 3
  selector:
    matchLabels:
      app: futurapredict
      component: api
  template:
    metadata:
      labels:
        app: futurapredict
        component: api
    spec:
      containers:
      - name: api
        image: futurapredict:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "False"
        - name: DB_HOST
          value: postgres-service
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: db-name
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: db-password
        - name: CELERY_BROKER_URL
          value: redis://redis-service:6379
        - name: CELERY_RESULT_BACKEND
          value: redis://redis-service:6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
