apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: futurapredict-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.futurapredict.com
    secretName: futurapredict-tls
  rules:
  - host: api.futurapredict.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80
