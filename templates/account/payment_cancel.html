{% extends 'base.html' %}

{% block title %}Payment Cancelled{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-5 border-0 shadow-sm">
                <div class="mb-3">
                    <i class="fas fa-times-circle text-danger" style="font-size: 3rem;"></i>
                </div>
                <h2 class="mb-3">Payment Cancelled</h2>
                <p class="text-muted mb-4">You have cancelled the payment process. No charges have been made.</p>
                <div class="d-grid gap-2">
                    <a href="{% url 'payment_page' %}" class="btn btn-primary btn-lg">Try Again</a>
                    <a href="{% url 'home' %}" class="btn btn-outline-secondary">Go to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
