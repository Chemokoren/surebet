{% extends 'base_account.html' %}

{% block title %}Sign Up — FuturaPredict{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-4">
        <h3 class="mb-3">Create your account</h3>
        <form id="signup-form" method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="id_username" class="form-label">Username</label>
            <input type="text" class="form-control" id="id_username" name="username" required>
          </div>
          <div class="mb-3">
            <label for="id_email" class="form-label">Email</label>
            <input type="email" class="form-control" id="id_email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" class="form-control" id="id_password" name="password" required>
          </div>
          <div class="d-grid">
            <button class="btn btn-primary" type="submit">Sign up</button>
          </div>
        </form>
        <hr>
        <p class="small text-muted mt-3">By signing up you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</p>
        <p class="small text-muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const formData = new FormData(form);
  
  try {
    const response = await fetch('/v1/account/register/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': formData.get('csrfmiddlewaretoken')
      },
      body: JSON.stringify({
        username: formData.get('username'),
        email: formData.get('email'),
        password: formData.get('password')
      })
    });
    
    const data = await response.json();
    
    if (response.ok) {
      // Redirect to signup success page
      window.location.href = '{% url "signup_success" %}';
    } else {
      // Show error toast
      showToast(data.error || 'Signup failed', 'error');
    }
  } catch (error) {
    console.error('Error:', error);
    showToast('An error occurred during signup', 'error');
  }
});
</script>
{% endblock %}
