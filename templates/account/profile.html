{% extends 'base_account.html' %}
{% load static %}

{% block title %}Profile - FuturaPredict{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="gradient-text">User Profile</h2>
                        <p class="text-muted">Manage your account information</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        <!-- Profile Picture -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                <img src="{% static 'images/default-avatar.png' %}" alt="Profile Picture"
                                     class="rounded-circle" style="width: 120px; height: 120px; object-fit: cover;">
                                <button type="button" class="btn btn-sm btn-primary position-absolute bottom-0 end-0 rounded-circle">
                                    <i class="fas fa-camera"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Personal Information -->
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="first_name" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="first_name" name="first_name"
                                       value="{{ user.first_name }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="last_name" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="last_name" name="last_name"
                                       value="{{ user.last_name }}" required>
                            </div>
                            <div class="col-12">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email"
                                       value="{{ user.email }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone"
                                       placeholder="+1 (555) 123-4567">
                            </div>
                            <div class="col-md-6">
                                <label for="date_of_birth" class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                            </div>
                        </div>

                        <!-- Preferences -->
                        <div class="mt-4">
                            <h5 class="mb-3">Preferences</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Favorite League</label>
                                    <select class="form-select" name="favorite_league">
                                        <option value="">Select League</option>
                                        <option value="premier-league">Premier League</option>
                                        <option value="la-liga">La Liga</option>
                                        <option value="bundesliga">Bundesliga</option>
                                        <option value="serie-a">Serie A</option>
                                        <option value="ligue-1">Ligue 1</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Favorite Team</label>
                                    <input type="text" class="form-control" name="favorite_team"
                                           placeholder="e.g., Manchester United">
                                </div>
                            </div>
                        </div>

                        <!-- Notification Settings -->
                        <div class="mt-4">
                            <h5 class="mb-3">Notification Settings</h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="email_notifications" name="email_notifications" checked>
                                <label class="form-check-label" for="email_notifications">
                                    Email notifications for important updates
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="match_reminders" name="match_reminders" checked>
                                <label class="form-check-label" for="match_reminders">
                                    Match reminders and predictions
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="weekly_digest" name="weekly_digest">
                                <label class="form-check-label" for="weekly_digest">
                                    Weekly performance digest
                                </label>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-primary flex-fill">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="{% url 'password_change' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-key"></i> Change Password
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Form validation
(function() {
    'use strict';
    window.addEventListener('load', function() {
        var forms = document.querySelectorAll('form');
        Array.prototype.slice.call(forms).forEach(function(form) {
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    }, false);
})();
</script>
{% endblock %}
