{% extends 'base_account.html' %}

{% block title %}Welcome to FuturaPredict!{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card p-5 border-0 shadow-sm">
        <div class="mb-3">
          <i class="fas fa-check-circle text-success" style="font-size: 3rem;"></i>
        </div>
        <h2 class="mb-2">Welcome to FuturaPredict!</h2>
        <p class="text-muted mb-4">Your account has been created successfully.</p>
        <p class="mb-4">You can now log in and start exploring sports predictions powered by AI.</p>
        <div class="d-grid gap-2">
          <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Go to Login</a>
          <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg">Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
